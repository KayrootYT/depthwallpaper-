name: Build Depth Wallpaper APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -q DepthWallpaper-Android-Project.zip
          test -f DepthWallpaper/gradlew || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Required Models
        working-directory: DepthWallpaper
        run: |
          if [ -f download_models.sh ]; then
            bash download_models.sh
          fi

      - name: Build Debug APK
        working-directory: DepthWallpaper
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DepthWallpaper-APK
          path: DepthWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
